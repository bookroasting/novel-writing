<!-- 글꼴 CSS가 응답하지 않아도 화면을 막지 않게 print로 받아 두었다가 다 받으면 켠다. 쪽을 나눈 뒤에 도착하면 켜지 않는다(쪽 나눔이 어긋나지 않게). 못 받으면 시스템 글꼴로 읽는다 -->
<link rel="stylesheet" crossorigin media="print" onload="if (!window.__ebookPaginated) { this.media='all'; window.__fontCss = true; }" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<noscript><link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"></noscript>
<style>
  :root {
    --paper: #f5efe6;
    --ink: #1a1a1a;
    --ink-soft: #555;
    --accent: #8b6f47;
    --bg: #d8cfc2;
    --shadow: rgba(0, 0, 0, 0.18);
    --toolbar-bg: rgba(255, 255, 255, 0.85);
    --toolbar-border: #c5b9a5;
  }
  [data-theme="dark"] {
    --paper: #2a2522;
    --ink: #d8cfbf;
    --ink-soft: #998c79;
    --accent: #c0a075;
    --bg: #1a1714;
    --shadow: rgba(0, 0, 0, 0.55);
    --toolbar-bg: rgba(40, 35, 32, 0.9);
    --toolbar-border: #4a3f35;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: var(--bg);
    color: var(--ink);
    transition: background 0.3s ease, color 0.3s ease;
    font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    overscroll-behavior: none;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    padding: 0;
  }

  .toolbar {
    position: fixed;
    top: 16px;
    right: 16px;
    display: flex;
    gap: 8px;
    align-items: center;
    background: var(--toolbar-bg);
    border: 1px solid var(--toolbar-border);
    border-radius: 24px;
    padding: 6px 10px;
    backdrop-filter: blur(6px);
    z-index: 100;
    box-shadow: 0 2px 8px var(--shadow);
    font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  }
  .toolbar button {
    border: none;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 18px;
    font-size: 14px;
    font-family: inherit;
    transition: background 0.2s;
  }
  .toolbar button:hover { background: rgba(139, 111, 71, 0.15); }
  .toolbar button:disabled { opacity: 0.35; cursor: not-allowed; }
  .toolbar .counter {
    font-size: 13px;
    color: var(--ink-soft);
    min-width: 60px;
    text-align: center;
  }
  .toolbar .divider {
    width: 1px;
    height: 18px;
    background: var(--toolbar-border);
  }

  /* 우측 슬라이드 목차 패널 */
  #toc-panel {
    position: fixed;
    top: 0;
    right: 0;
    width: 300px;
    max-width: 80vw;
    height: 100%;
    background: var(--paper);
    color: var(--ink);
    box-shadow: -8px 0 32px var(--shadow);
    z-index: 200;
    transform: translateX(100%);
    transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
    font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  }
  #toc-panel.open { transform: translateX(0); }
  #toc-panel .toc-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 24px 24px 18px;
    border-bottom: 1px solid var(--toolbar-border);
  }
  #toc-panel .toc-head h2 {
    margin: 0;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.4em;
    color: var(--ink);
  }
  #toc-panel .toc-close {
    background: transparent;
    border: none;
    color: var(--ink-soft);
    font-size: 24px;
    cursor: pointer;
    line-height: 1;
    padding: 0 4px;
  }
  #toc-panel .toc-close:hover { color: var(--ink); }
  #toc-panel ul {
    list-style: none;
    padding: 8px 0;
    margin: 0;
    flex: 1;
    overflow-y: auto;
  }
  #toc-panel li {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 16px 24px;
    cursor: pointer;
    border-bottom: 1px dashed var(--toolbar-border);
    transition: background 0.15s, color 0.15s;
  }
  #toc-panel li:hover {
    background: rgba(139, 111, 71, 0.12);
    color: var(--accent);
  }
  #toc-panel .toc-name { font-size: 14px; font-weight: 500; }
  #toc-panel .toc-page { font-size: 11px; color: var(--ink-soft); letter-spacing: 0.1em; }
  #toc-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.32);
    z-index: 150;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  #toc-overlay.open { opacity: 1; pointer-events: auto; }

  #book-wrap {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  #book {
    width: 920px;
    height: 720px;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* StPageFlip 자체 컨테이너도 가운데 */
  .stf__parent {
    margin: 0 auto !important;
  }

  .page {
    background: var(--paper);
    color: var(--ink);
    padding: 56px 58px 88px;  /* 위 56(쪽 머리까지), 아래 88 = 쪽 번호 아래 여백 56 + 번호 높이 + 본문과의 간격. 위아래 바깥 여백을 56으로 맞춘다 */
    overflow: hidden !important;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.04);
    transition: background 0.3s ease, color 0.3s ease;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    width: 100%;
    height: 100%;
    position: relative;
    will-change: transform;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .page-body {
    flex: 1 1 0;
    overflow: hidden !important;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .page-body > * {
    flex: 0 0 auto;
  }
  /* StPageFlip 내부 요소: 클론된 페이지에서도 콘텐츠 클립 */
  .stf__block, .stf__item, .stf__wrapper {
    overflow: hidden !important;
  }

  .page.cover {
    background: var(--paper);
    padding: 0;
    position: relative;
    display: block;
    overflow: hidden;
  }
  .cover-fullart {
    position: absolute;
    inset: 0;
  }
  .cover-fullart > svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
/* 표지 텍스트는 이제 SVG 내부에 통합됨 */
  .page.back-cover {
    background: var(--paper);
    padding: 0;
    position: relative;
    display: block;
    overflow: hidden;
  }
  .back-fullart {
    position: absolute;
    inset: 0;
  }
  .back-fullart > svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .back-text-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 76px 56px 70px;
    z-index: 3;
    text-align: center;
  }
  .back-tag {
    font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
    font-size: 10px;
    letter-spacing: 0.4em;
    color: #e8d4a8;
    opacity: 0.78;
  }
  .back-text-overlay .back-mid {
    display: flex;
    flex-direction: column;
    justify-content: center;
    flex: 1;
  }
  .back-text-overlay .back-quote {
    font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
    font-style: italic;
    font-size: 17px;
    line-height: 1.7;
    font-weight: 500;
    color: #f4e8c8;
    margin: 0 0 12px;
  }
  .back-quote-attr {
    font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
    font-size: 10px;
    color: #e8d4a8;
    letter-spacing: 0.1em;
    opacity: 0.7;
    margin-bottom: 38px;
  }
  .back-synopsis {
    font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
    font-size: 12px;
    line-height: 1.95;
    color: #e8d4a8;
    opacity: 0.85;
  }
  .back-author-line {
    font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
    font-size: 12px;
    letter-spacing: 0.25em;
    font-weight: 600;
    color: #f4e8c8;
    margin-bottom: 14px;
  }
  .back-text-overlay .back-publisher {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: #e8d4a8;
    font-size: 9.5px;
    letter-spacing: 0.24em;
    font-weight: 500;
    opacity: 0.82;
  }
  .back-publisher .pub-mark {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    border: 0.7px solid #e8d4a8;
    position: relative;
  }
  .back-publisher .pub-mark::before {
    content: '';
    position: absolute;
    inset: 3px;
    background: #e8d4a8;
    border-radius: 50%;
  }

  .cover-spine {
    width: 60px;
    height: 1px;
    background: var(--accent);
    margin: 12px auto 18px;
  }
  .cover-title {
    font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 28px;
    font-weight: 700;
    text-align: center;
    margin: 14px 0 18px;
    letter-spacing: -0.02em;
  }
  .cover-subtitle {
    font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 12px;
    color: var(--ink-soft);
    text-align: center;
    letter-spacing: 0.3em;
    margin-bottom: 12px;
  }
  .cover-author {
    font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 13px;
    color: var(--ink-soft);
    margin: 14px 0 4px;
    letter-spacing: 0.2em;
    text-align: center;
    width: 100%;
  }
  .cover-mark {
    font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 10px;
    letter-spacing: 0.1em;
    text-align: center;
    width: 100%;
  }

  .page.toc {
    background: var(--paper);
    padding: 0;
    position: relative;
    display: block;
  }
  .page.toc .toc-wrap {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: calc(100% - 100px);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .page.toc .toc-list {
    width: 100%;
  }
  .page.toc h2 {
    font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 32px;
    text-align: center;
    letter-spacing: 0.4em;
  }
  .toc-list {
    list-style: none;
    padding: 0;
    margin: 0;
    font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  }
  .toc-list li {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 16px 4px;
    border-bottom: 1px dashed var(--toolbar-border);
    cursor: pointer;
    transition: background 0.15s;
  }
  .toc-list li:hover { background: rgba(139, 111, 71, 0.08); }
  .toc-list .toc-name { font-size: 15px; }
  .toc-list .toc-page {
    font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 12px;
    color: var(--ink-soft);
  }

  h1.chapter {
    font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 28px;
    color: var(--ink);
    letter-spacing: -0.01em;
  }

  /* 표지 다음 인용 페이지 (epigraph) */
  .page.epigraph {
    background: var(--paper);
    padding: 0;
    position: relative;
    display: block;
  }
  .page.epigraph .epigraph-inner {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: calc(100% - 120px);
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 36px;
  }
  .page.epigraph .epigraph-rule {
    width: 80px;
    height: 1px;
    background: var(--accent);
    opacity: 0.55;
  }
  .page.epigraph .epigraph-line {
    font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
    font-size: 15px;
    font-weight: 400;
    line-height: 1.85;
    color: var(--ink);
    margin: 0;
    letter-spacing: 0.02em;
    opacity: 0.88;
  }
  .page.epigraph .epigraph-attr {
    font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
    font-size: 11px;
    line-height: 1.7;
    color: var(--ink-soft);
    margin: 0;
    letter-spacing: 0.06em;
    opacity: 0.75;
  }
  .page.epigraph .running-head,
  .page.epigraph .page-number { display: none; }

  /* 챕터 제목 별도 페이지 디자인 */
  .page.chapter-title-page {
    background: var(--paper);
    padding: 0;
    position: relative;
    display: block;
  }
  .chapter-title-inner {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
    width: calc(100% - 120px);
    text-align: center;
  }
  .chapter-rule {
    width: 80px;
    height: 1px;
    background: var(--accent);
    opacity: 0.7;
  }
  .chapter-rule-top, .chapter-rule-bottom {
    position: relative;
  }
  .chapter-rule-top::before, .chapter-rule-bottom::before,
  .chapter-rule-top::after, .chapter-rule-bottom::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--accent);
    transform: translateY(-50%);
  }
  .chapter-rule-top::before, .chapter-rule-bottom::before { left: -10px; }
  .chapter-rule-top::after, .chapter-rule-bottom::after { right: -10px; }
  .chapter-num {
    font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
    font-size: 64px;
    font-weight: 200;
    color: var(--ink);
    letter-spacing: -0.04em;
    line-height: 1;
  }
  .chapter-num::after {
    content: '장';
    font-size: 18px;
    font-weight: 400;
    margin-left: 8px;
    color: var(--ink-soft);
    letter-spacing: 0.1em;
    vertical-align: super;
  }
  .chapter-name {
    font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
    font-size: 24px;
    font-weight: 500;
    color: var(--ink);
    letter-spacing: 0.4em;
    text-indent: 0.4em;
  }
  .chapter-name.extra-section {
    font-size: 36px;
    font-weight: 600;
    letter-spacing: 0.5em;
    text-indent: 0.5em;
    margin: 30px 0;
  }
  .page.chapter-title-page .running-head,
  .page.chapter-title-page .page-number { display: none; }

  .page p {
    font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 14.5px;
    line-height: 1.85;
    margin: 0 0 0.7em;
    text-indent: 1em;
    word-break: keep-all;
    line-break: strict;
  }
  .page-body p:last-child { margin-bottom: 0; }
  .page-body h1.chapter:first-child { margin-top: 0; }

  .page-number {
    position: absolute;
    bottom: 56px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.1em;
  }
  .page.cover .page-number,
  .page.back-cover .page-number,
  .page.title-page .page-number,
  .page.toc .page-number { display: none; }

  .running-head {
    flex: 0 0 auto;
    text-align: center;
    font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 10px;
    color: var(--ink-soft);
    letter-spacing: 0.25em;
    margin-bottom: 22px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--toolbar-border);
  }
  .running-head.running-head-art {
    position: relative;
    letter-spacing: 0;
    color: transparent;
  }
  .running-head.running-head-art > svg {
    position: absolute;
    right: 0;
    bottom: 1px;
    display: block;
    color: var(--ink-soft);
  }
  .page.cover .running-head,
  .page.back-cover .running-head,
  .page.title-page .running-head,
  .page.toc .running-head,
  .page.chapter-start .running-head { display: none; }

  .page.title-page {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 80px 50px;
  }
  .title-page-inner {
    text-align: center;
  }
  .title-page-title {
    font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 24px;
  }
  .title-page-author {
    font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 14px;
    color: var(--ink-soft);
    letter-spacing: 0.15em;
  }

  .page.copyright-page {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 80px 50px;
  }
  .page.copyright-page .running-head,
  .page.copyright-page .page-number { display: none; }
  .copyright-inner {
    text-align: center;
    width: 100%;
    max-width: 320px;
    font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  }
  .copyright-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--ink);
  }
  .copyright-meta {
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.3em;
    margin-bottom: 28px;
  }
  .copyright-rule {
    width: 36px;
    height: 1px;
    background: var(--toolbar-border);
    margin: 18px auto;
  }
  .copyright-credits {
    font-size: 12px;
    line-height: 2;
    color: var(--ink);
  }
  .copyright-isbn {
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.05em;
    margin-bottom: 8px;
    font-family: 'SF Mono', 'JetBrains Mono', Menlo, Monaco, monospace;
  }
  .copyright-c {
    font-size: 10px;
    color: var(--ink-soft);
    letter-spacing: 0.05em;
  }

  /* 본문 페이지 종이 질감 (옅게) */
  .page-body {
    position: relative;

    s.onload = () => (window.St && window.St.PageFlip) ? window.dispatchEvent(new Event('stpageflip-ready')) : tryNext();
    s.onerror = tryNext;
    document.head.appendChild(s);
  }
  tryNext();
})();
</script>
<script>
(function () {
  // 쪽 나누기는 실제로 보여 줄 글자 크기로 계산한다. 글자 크기를 바꾸면 다시 나눈다
  const FS_ALLOWED = ['s', 'm', 'l'];
  const CUR_FS = (() => { try { const v = localStorage.getItem('ebook-fs'); return FS_ALLOWED.includes(v) ? v : 'm'; } catch (e) { return 'm'; } })();
  // 쪽 크기: 기준 460×720 비율을 지키며 지금 화면에 들어가는 크기로 정한다.
  // 휴대폰(폭 768 미만)은 한 쪽, 그 이상은 양면. 쪽 나누기도 이 크기로 계산한다.
  const BASE_W = 460, BASE_H = 720, RATIO = BASE_W / BASE_H;
  // 한 쪽 보기: 폭 768 미만(휴대폰 세로) 또는 높이 520 미만(휴대폰 가로)
  function pageSize() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const single = vw < 768 || vh < 520;
    const availH = vh - 72;                                     // 위 도구막대 자리
    const availW = single ? vw - 16 : (vw - 48) / 2;
    if (vh < 520) {                                             // 낮은 가로 화면: 도구막대를 옆으로 빼고, 비율보다 읽을 폭을 지킨다
      const w = Math.min(BASE_W, Math.max(280, vw - 2 * 84));   // 양옆에 세로 도구막대 자리(84)를 남긴다
      return { single, w: Math.round(w), h: Math.round(Math.max(240, vh - 16)) };
    }
    const h = Math.max(260, Math.min(BASE_H, availH, Math.floor(availW / RATIO)));
    return { single, w: Math.round(h * RATIO), h };
  }
  const PS = pageSize();
  const IS_PORTRAIT = PS.single;
  const PAGE_H = PS.h;
  const PAGE_W = PS.w;
  const PADDING_V = 32;
  const PADDING_H = 50;
  const RUNHEAD_RESERVE = 50;   // running-head + margin + border
  const PAGENUM_RESERVE = 44;   // page-number + margin + padding
  const INNER_W = PAGE_W - PADDING_H * 2;
  const INNER_H = PAGE_H - PADDING_V * 2 - RUNHEAD_RESERVE - PAGENUM_RESERVE;

  function parseMarkdown(text) {
    const blocks = text.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
    const segs = [];
    for (const b of blocks) {
      if (b.startsWith('# ')) segs.push({ type: 'chapter', title: b.slice(2).trim() });
      else segs.push({ type: 'paragraph', text: b });
    }
    return segs;
  }

  function makeSamplePage() {
    // 실제 페이지와 동일한 구조의 측정용 페이지 (오프스크린)
    const page = document.createElement('div');
    page.className = 'page';
    page.style.width = PAGE_W + 'px';
    page.style.height = PAGE_H + 'px';
    page.style.position = 'absolute';
    page.style.left = '-10000px';
    page.style.top = '0';
    page.style.visibility = 'hidden';

    const head = document.createElement('div');
    head.className = 'running-head';
    head.textContent = "김장하는 날";
    page.appendChild(head);

    const body = document.createElement('div');
    body.className = 'page-body';
    body.dataset.fs = CUR_FS;
    page.appendChild(body);

    const num = document.createElement('div');
    num.className = 'page-number';
    num.textContent = '00';
    page.appendChild(num);

    document.body.appendChild(page);
    return { page, body };
  }

  function appendItem(body, item) {
    if (item.type === 'h1') {
      const h = document.createElement('h1');
      h.className = 'chapter';
      h.textContent = item.text;
      body.appendChild(h);
    } else {
      const p = document.createElement('p');
      p.textContent = item.text;
      if (item.split) p.classList.add('split');
      if (item.cont) p.classList.add('cont');
      body.appendChild(p);
    }
    return body.lastChild;
  }

  function fits(body, item, availH) {
    const node = appendItem(body, item);
    const ok = body.scrollHeight <= availH;
    body.removeChild(node);
    return ok;
  }

  function paginate(segments) {
    const { page: sample, body: sampleBody } = makeSamplePage();
    // 가용 높이 = page-body clientHeight 와 명시 계산값 중 큰 값
    // 명시: PAGE_H - padding(36*2=72) - runhead(45) - pagenum(42) = 561
    // 쪽 번호는 absolute라 흐름에 끼지 않는다. 측정값이 비정상일 때만 계산값을 쓴다
    const measuredH = sampleBody.clientHeight;
    const explicitH = PAGE_H - 56 - 88 - 45;
    const availH = measuredH > 200 ? measuredH : explicitH;

    const pages = [];
    let buf = [];
    let isChapter = false;

    function flush() {
      if (buf.length) {
        pages.push({ items: buf.slice(), isChapter });
        buf = [];
        isChapter = false;
      }
      sampleBody.innerHTML = '';
      // restore items already pushed back to buf
      for (const it of buf) appendItem(sampleBody, it);
    }

    for (const seg of segments) {
      if (seg.type === 'chapter') {
        flush();
        // 챕터 제목은 별도 한 페이지
        pages.push({ items: [{ type: 'chapter-title', text: seg.title }], isChapterTitle: true });
        sampleBody.innerHTML = '';
      } else {
        // 문단이 남은 자리에 다 들어가지 않으면 들어가는 만큼(어절 단위)만 이 쪽에 두고 나머지를 다음 쪽으로 넘긴다
        let text = seg.text, cont = false;
        while (text) {
          const whole = { type: 'p', text, cont };
          if (fits(sampleBody, whole, availH)) {
            appendItem(sampleBody, whole);
            buf.push(whole);
            break;
          }
          const words = text.split(' ');
          let lo = 1, hi = words.length - 1, best = 0;
          while (lo <= hi) {
            const mid = (lo + hi) >> 1;
            if (fits(sampleBody, { type: 'p', text: words.slice(0, mid).join(' '), cont, split: true }, availH)) { best = mid; lo = mid + 1; }
            else hi = mid - 1;
          }
          if (best === 0 && buf.length === 0) {  // 빈 쪽에도 한 어절이 안 들어가는 극단: 그대로 둔다
            buf.push(whole);
            break;
          }
          if (best > 0) {
            buf.push({ type: 'p', text: words.slice(0, best).join(' '), cont, split: true });
            text = words.slice(best).join(' ');
            cont = true;
          }
          flush();
        }
      }
    }
    flush();
    sample.remove();
    return pages;
  }

  function makePageEl(content, opts = {}) {
    const page = document.createElement('div');
    page.className = 'page' + (opts.cls ? ' ' + opts.cls : '');
    if (opts.html) page.innerHTML = content;
    else page.appendChild(content);
    return page;
  }

  function buildBodyPage(items, idx, totalBody, chapterLabel, isChapter, isChapterTitle) {

        inner.innerHTML = `

    const head = document.createElement('div');
    head.className = 'running-head';
    const isRightPage = (idx % 2 === 1);
    if (false && isRightPage) {
      head.classList.add('running-head-art');
      const seed = idx % 13;
      head.innerHTML = ` <svg width="22" height="28" viewBox="0 0 60 76" xmlns="http://www.w3.org/2000/svg" aria-label="김장하는 날" focusable="false">
        <defs>

        <g filter="url(#rh-pen-${idx})" stroke="currentColor" fill="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
          <line x1="30" y1="10" x2="30" y2="3"/>
          <circle cx="30" cy="2" r="1.6" fill="currentColor" stroke="none"/>
          <path d="M 5 22 Q 5 10 17 10 L 43 10 Q 55 10 55 22 L 55 64 Q 55 73 45 73 L 15 73 Q 5 73 5 64 Z"/>
          <circle cx="20" cy="36" r="3.2" fill="currentColor" stroke="none"/>
          <circle cx="40" cy="36" r="3.2" fill="currentColor" stroke="none"/>
          <line x1="20" y1="55" x2="40" y2="55" stroke-width="0.8"/>
          <line x1="23" y1="61" x2="37" y2="61" stroke-width="0.7"/>
        </g>
      </svg>`;
    } else {
      head.textContent = "김장하는 날";
    }
    page.appendChild(head);

    const body = document.createElement('div');
    body.className = 'page-body';
    body.dataset.fs = CUR_FS;
    for (const it of items) {
      const p = document.createElement('p');
      p.textContent = it.text;
      if (it.split) p.classList.add('split');
      if (it.cont) p.classList.add('cont');
      body.appendChild(p);
    }
    page.appendChild(body);

    const num = document.createElement('div');
    num.className = 'page-number';
    num.textContent = idx;
    page.appendChild(num);

    return page;
  }

  function buildCover() {
    const html = `

    const html = `

  function tocItem(ch) {
    const li = document.createElement('li');
    li.dataset.page = ch.pageIdx;
    li.innerHTML = `<span class="toc-name">${ch.title}</span><span class="toc-page">${ch.pageIdx}</span>`;

  // 목차를 쪽 높이에 맞춰 여러 쪽으로 나눈다 (낮은 화면에서도 잘리지 않게)
  function buildTocPages(entries) {
    const probe = document.createElement('div');
    probe.className = 'page toc';
    probe.style.cssText = `width:${PAGE_W}px;height:${PAGE_H}px;position:absolute;left:-10000px;top:0;visibility:hidden;`;
    document.body.appendChild(probe);
    const limit = PAGE_H - 48;
    const pages = [];
    let i = 0;
    do {
      const wrap = document.createElement('div');
      wrap.className = 'toc-wrap';
      const h2 = document.createElement('h2');
      h2.textContent = pages.length ? '목 차 (계속)' : '목 차';
      wrap.appendChild(h2);
      const ul = document.createElement('ul');
      ul.className = 'toc-list';
      wrap.appendChild(ul);
      probe.innerHTML = '';
      probe.appendChild(wrap);
      let placed = 0;
      while (i < entries.length) {
        const li = tocItem(entries[i]);
        ul.appendChild(li);
        if (wrap.offsetHeight > limit && placed > 0) { ul.removeChild(li); break; }
        placed++;
        i++;
      }
      probe.removeChild(wrap);
      pages.push(makePageEl(wrap, { cls: 'toc' }));
    } while (i < entries.length);
    probe.remove();
    return pages;
  }

  // Theme
  function initTheme() {
    const saved = localStorage.getItem('ebook-theme') || 'light';
    document.documentElement.setAttribute('data-theme', saved);
    document.getElementById('theme-btn').textContent = saved === 'dark' ? '☀' : '🌙';
  }
  function toggleTheme() {
    const cur = document.documentElement.getAttribute('data-theme') || 'light';
    const nxt = cur === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', nxt);
    document.getElementById('theme-btn').textContent = nxt === 'dark' ? '☀' : '🌙';
    localStorage.setItem('ebook-theme', nxt);
  }

  function init() {
    initTheme();
    document.getElementById('theme-btn').addEventListener('click', toggleTheme);

    const md = document.getElementById('manuscript').textContent.trim();
    const segs = parseMarkdown(md);
    const bodyPages = paginate(segs);

    // Determine chapter starts
    const chapterPages = [];
    
    const src = document.getElementById('pages-src');

    // Front matter: Cover → Title → Copyright → Epigraph → TOC
    src.appendChild(buildCover());           // 1: cover
    src.appendChild(buildTitle());           // 2: title page
    src.appendChild(buildCopyright());       // 3: copyright
    if (false) src.appendChild(buildEpigraph());        // 4: epigraph

    // 목차 쪽 수를 먼저 센 뒤 본문 시작 쪽을 정한다 (1부터 세는 쪽 번호: 앞부분 + 목차 쪽 수 + 1)
    const chapterTitles = bodyPages.map((bp, i) => (bp.isChapterTitle ? { title: bp.items[0].text, i } : null)).filter(Boolean);
    const tocCount = buildTocPages(chapterTitles.map(c => ({ title: c.title, pageIdx: 999 }))).length;
    const bodyStartIdx = src.children.length + tocCount + 1;
    chapterTitles.forEach(c => chapterPages.push({ title: c.title, pageIdx: bodyStartIdx + c.i }));

    buildTocPages(chapterPages).forEach(pg => src.appendChild(pg)); // 목차 (여러 쪽일 수 있다)

    bodyPages.forEach((bp, i) => {
      const idx = bodyStartIdx + i;
      src.appendChild(buildBodyPage(bp.items, idx, bodyPages.length, '', false, !!bp.isChapterTitle));
    });

    // Back matter
    src.appendChild(buildBackCover());

    // Even page count for spread
    const totalPages = src.children.length;
    if (totalPages % 2 !== 0) {
      src.insertBefore(buildBlank(), src.lastChild);
    }

    // StPageFlip
    const book = document.getElementById('book');
    const isMobile = IS_PORTRAIT;
    const pageFlip = new St.PageFlip(book, {
      width: PAGE_W,
      height: PAGE_H,
      size: 'stretch',
      minWidth: PAGE_W,
      maxWidth: PAGE_W,
      minHeight: PAGE_H,
      maxHeight: PAGE_H,
      drawShadow: true,
      flippingTime: 650,
      usePortrait: isMobile,  // 모바일은 단일 페이지, 데스크톱은 spread
      startZIndex: 0,
      autoSize: true,
      maxShadowOpacity: 0.22,
      showCover: true,
      mobileScrollSupport: false,
      swipeDistance: 30
    });

    pageFlip.loadFromHTML(document.querySelectorAll('#pages-src .page'));
    // 창 크기가 크게 바뀌면(한 쪽↔양면, 높이 변화) 쪽을 다시 나눈다. 읽던 위치는 유지한다
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        const ps = pageSize();
        if (ps.single !== IS_PORTRAIT || Math.abs(ps.h - PAGE_H) > 24 || Math.abs(ps.w - PAGE_W) > 24) {
          try { sessionStorage.setItem('ebook-progress', String(pageFlip.getCurrentPageIndex() / Math.max(1, pageFlip.getPageCount() - 1))); } catch (e) {}
          location.reload();
        }
      }, 300);
    });
    try {
      const prog = parseFloat(sessionStorage.getItem('ebook-progress'));
      if (!isNaN(prog)) {
        sessionStorage.removeItem('ebook-progress');
        pageFlip.turnToPage(Math.round(prog * (pageFlip.getPageCount() - 1)));
      }
    } catch (e) {}

    // Counter + Progress
    const counter = document.getElementById('counter');
    const progressBar = document.getElementById('progress-bar');
    const total = pageFlip.getPageCount();
    function updateCounter() {
      const idx = pageFlip.getCurrentPageIndex();
      counter.textContent = (idx + 1) + ' / ' + total;
      document.getElementById('prev-btn').disabled = idx === 0;
      document.getElementById('next-btn').disabled = idx >= total - 1;
      const pct = total > 1 ? (idx / (total - 1)) * 100 : 0;
      progressBar.style.width = pct + '%';
    }
    pageFlip.on('flip', updateCounter);
    updateCounter();

    // 폰트 크기 토글 (s ↔ m ↔ l)
    const FS_STEPS = ['s', 'm', 'l'];
    const FS_LABELS = { s: '가', m: '가', l: '가' };
    let fsIdx = FS_STEPS.indexOf(CUR_FS);
    if (fsIdx < 0) fsIdx = 1;
    function applyFontSize() {
      const cur = FS_STEPS[fsIdx];
      document.querySelectorAll('.page .page-body').forEach(b => b.dataset.fs = cur);
      const btn = document.getElementById('fs-btn');
      btn.textContent = cur === 's' ? '가⁻' : cur === 'l' ? '가⁺' : '가';
      btn.title = '글자 크기 (현재 ' + (cur === 's' ? '작게' : cur === 'l' ? '크게' : '보통') + ')';
      try { localStorage.setItem('ebook-fs', cur); } catch (e) {}
    }
    document.getElementById('fs-btn').addEventListener('click', () => {
      fsIdx = (fsIdx + 1) % FS_STEPS.length;
      applyFontSize();
      // 글자 크기가 바뀌면 쪽 나누기를 다시 한다. 읽던 위치(전체 진행률)는 유지한다
      try { sessionStorage.setItem('ebook-progress', String(pageFlip.getCurrentPageIndex() / Math.max(1, pageFlip.getPageCount() - 1))); } catch (e) {}
      location.reload();
    });
    applyFontSize();
    setTimeout(applyFontSize, 200); // StPageFlip이 DOM 재배치 후 재적용

    // Controls
    document.getElementById('prev-btn').addEventListener('click', () => pageFlip.flipPrev());
    document.getElementById('next-btn').addEventListener('click', () => pageFlip.flipNext());
    // 목차 사이드 패널 동적 생성
    const tocList = document.getElementById('toc-panel-list');
    tocList.innerHTML = '';
    chapterPages.forEach((cp) => {
      const li = document.createElement('li');
      li.dataset.page = cp.pageIdx;
      li.innerHTML = `<span class="toc-name">${cp.title}</span><span class="toc-page">${cp.pageIdx}쪽</span>`;
      tocList.appendChild(li);
    });

    const tocPanel = document.getElementById('toc-panel');
    const tocOverlay = document.getElementById('toc-overlay');
    function openToc() {
      tocPanel.classList.add('open');
      tocOverlay.classList.add('open');
      tocPanel.setAttribute('aria-hidden', 'false');
    }
    function closeToc() {
      tocPanel.classList.remove('open');
      tocOverlay.classList.remove('open');
      tocPanel.setAttribute('aria-hidden', 'true');
    }
    function toggleToc() {
      if (tocPanel.classList.contains('open')) closeToc();
      else openToc();
    }

    document.getElementById('toc-btn').addEventListener('click', toggleToc);
    document.getElementById('toc-close').addEventListener('click', closeToc);
    tocOverlay.addEventListener('click', closeToc);

    // 사이드 패널 챕터 클릭 → 페이지 점프 + 패널 닫기
    tocList.addEventListener('click', (e) => {
      const li = e.target.closest('li');
      if (li && li.dataset.page) {
        pageFlip.flip(parseInt(li.dataset.page) - 1);
        closeToc();
      }
    });

    // ESC 키로 패널 닫기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && tocPanel.classList.contains('open')) closeToc();
    });

    // Keyboard
    document.addEventListener('keydown', (e) => {
      // 입력 필드에 포커스 있으면 단축키 무시
      const tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        pageFlip.flipPrev();
      } else if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
        e.preventDefault();
        pageFlip.flipNext();
      } else if (e.key === 'Home') {
        e.preventDefault();
        pageFlip.flip(0);
      } else if (e.key === 'End') {
        e.preventDefault();
        pageFlip.flip(total - 1);
      }
    });

    // 책 안 목차 페이지 클릭 → 페이지 점프
    // StPageFlip이 내부 클릭을 가로채기 때문에 캡처 단계에서 먼저 처리하고
    // 드래그-플립으로 오인되지 않도록 pointerdown 단계에서 전파 차단.
    function bindTocClicks() {
      document.querySelectorAll('.page.toc .toc-list li').forEach((li) => {
        if (li.dataset.tocBound === '1') return;
        li.dataset.tocBound = '1';
        ['pointerdown', 'mousedown', 'touchstart'].forEach((ev) => {
          li.addEventListener(ev, (e) => e.stopPropagation());
        });
        li.addEventListener('click', (e) => {
          e.stopPropagation();
          e.preventDefault();
          const target = parseInt(li.dataset.page, 10);
          if (!isNaN(target)) pageFlip.flip(target - 1);
        });
      });
    }
    bindTocClicks();
    // StPageFlip이 DOM을 재구성한 직후 다시 바인딩 (안전망)
    setTimeout(bindTocClicks, 100);

    // Hide loader
    setTimeout(() => {
      document.getElementById('loader').classList.add('hidden');
      setTimeout(() => document.getElementById('loader').remove(), 500);
    }, 200);
  }

  function start() {
    const begin = () => {
      if (window.__ebookStarted) return;
      window.__ebookStarted = true;
      // 웹폰트 로드 완료 후 페이지네이션 (사이즈 정확도)
      const fontsReady = document.fonts && document.fonts.ready
        ? document.fonts.ready
        : Promise.resolve();
      // 응답 없는 요청이 문서 로드를 붙잡아 fonts.ready가 끝나지 않을 수 있다. 1.5초 넘게 기다리지 않는다
      // 글꼴 CSS를 최대 2초 기다린 뒤, 글꼴 자체를 최대 1.5초 더 기다린다. 그 뒤에 도착한 글꼴은 쓰지 않는다
      const cssReady = new Promise(r => { const t0 = Date.now(); (function poll() { (window.__fontCss || Date.now() - t0 > 2000) ? r() : setTimeout(poll, 50); })(); });
      cssReady
        .then(() => Promise.race([document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve(), new Promise(r => setTimeout(r, 1500))]))
        .then(() => { window.__ebookPaginated = true; init(); });
    };
    if (typeof St === 'undefined' || !St.PageFlip) {
      window.addEventListener('stpageflip-ready', begin, { once: true });
      setTimeout(() => { if (!window.__ebookStarted && window.St && window.St.PageFlip) begin(); }, 5200);
    } else {
      begin();
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>

<!-- 디자인 전용 조각: 생성기가 값을 넣어 슬롯 자리에 옮기고 이 자리에서는 지운다 -->
