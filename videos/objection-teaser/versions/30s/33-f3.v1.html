          var CS1 = 1971;
          var STEPS = CS1 - CS0; // 671
          function pad2(n) {
            return n < 10 ? "0" + n : String(n);
          }
          var tcHtml = "";
          for (var c = CS0; c <= CS1; c++) {
            var sec = Math.floor(c / 100);
            tcHtml += "<span>" + pad2(Math.floor(sec / 60)) + ":" + pad2(sec % 60) + "." + pad2(c % 100) + "</span>";
          }
          $("f33_tcStrip").innerHTML = tcHtml;

          // ---------- rain: seeded thin diagonal streaks in two depths ----------
          var SLANT = 0.22; // falls down-left
          var FAR_D = 1800;
          var NEAR_D = 3000;
          function buildRain(id, seed, count, D, lenMin, lenMax, sw, opMin, opMax) {
            var r = rng(seed);
            var Wd = Math.round(1920 + SLANT * D + 60);
            var Ht = 1080 + D;
            var s = '<g stroke="#F5F5F2" stroke-width="' + sw + '" stroke-linecap="round" fill="none">';
            for (var i = 0; i < count; i++) {
              var x = r() * Wd;
              var y = r() * Ht;
              var len = lenMin + r() * (lenMax - lenMin);
              var op = opMin + r() * (opMax - opMin);
              s +=
                '<line x1="' + f1(x) + '" y1="' + f1(y) + '" x2="' + f1(x - SLANT * len) + '" y2="' + f1(y + len) +
                '" stroke-opacity="' + op.toFixed(3) + '"/>';
            }
            s += "</g>";
            var el = $(id);
            el.setAttribute("width", Wd);
            el.setAttribute("height", Ht);
            el.setAttribute("viewBox", "0 0 " + Wd + " " + Ht);
            el.innerHTML = s;
          }
          buildRain("f33_rainFar", 1301, 270, FAR_D, 30, 72, 1, 0.18, 0.28);
          buildRain("f33_rainNear", 1340, 205, NEAR_D, 80, 160, 1.4, 0.24, 0.35);

          // ---------- rain hero: per-letter spans ----------
          var hero1 = $("f33_hero1");
          var sheen1 = $("f33_sheen1");
          "토요일, 장맛비.".split("").forEach(function (ch) {
            var sp = document.createElement("span");
            sp.className = "f33_ch";
            sp.innerHTML = ch === " " ? "&nbsp;" : ch;
            hero1.insertBefore(sp, sheen1);
          });

          // ---------- pencil water lines: seeded uneven strokes, each higher, tick at the right end ----------
          // [y, x0, x1, ink]
          var LINES = [
            [862, 520, 1690, 0.4],
            [792, 590, 1650, 0.46],
            [722, 548, 1712, 0.52],
            [652, 630, 1676, 0.56],
            [586, 572, 1700, 0.6],
          ];
          var ls = "<defs>";
          LINES.forEach(function (L, i) {
            ls += '<clipPath id="f33_lc' + i + '"><rect id="f33_lr' + i + '" x="' + (L[1] - 8) + '" y="' + (L[0] - 30) +
              '" width="0" height="56"/></clipPath>';
          });
          ls += "</defs>";
          LINES.forEach(function (L, i) {
            var r = rng(2000 + i * 17);
            var y0 = L[0];
            var x0 = L[1];
            var x1 = L[2];
            var drift = 0;
            var pts = [];
            for (var x = x0; x <= x1 + 0.1; x += 22) {
              drift += (r() - 0.5) * 0.9;
              if (drift > 2.4) drift = 2.4;
              if (drift < -2.4) drift = -2.4;
              pts.push([Math.min(x, x1), y0 + drift + (r() - 0.5) * 0.8]);
            }
            var d1 = "";
            var d2 = "";
            pts.forEach(function (p, k) {
              d1 += (k ? " L" : "M") + f1(p[0]) + " " + f1(p[1]);
              d2 += (k ? " L" : "M") + f1(p[0] + 0.5) + " " + f1(p[1] + 0.7);
            });
            var ex = pts[pts.length - 1][0];
            var ey = pts[pts.length - 1][1];
            // illegible pencil tick: a short scribble, no glyphs
            var tk = "M" + f1(ex + 12) + " " + f1(ey - 3);
            var tx = ex + 12;
            for (var k = 0; k < 6; k++) {
              tx += 3 + r() * 3;
              tk += " L" + f1(tx) + " " + f1(ey - 4 - (k % 2 ? 1 + r() * 3 : 9 + r() * 5));
            }
            tk += " M" + f1(tx + 7) + " " + f1(ey - 15) + " L" + f1(tx + 12 + r() * 3) + " " + f1(ey - 3);
            var dash = (4 + r() * 5).toFixed(1) + " " + (1 + r() * 2).toFixed(1) + " " + (2 + r() * 4).toFixed(1) + " " + (1 + r()).toFixed(1);
            var ink = L[3];
            ls +=
              '<g clip-path="url(#f33_lc' + i + ')"><g filter="url(#f33_pencil)" fill="none" stroke="#F5F5F2" stroke-linecap="round" stroke-linejoin="round">' +
              '<path d="' + d1 + '" stroke-width="1.5" stroke-opacity="' + ink + '"/>' +
              '<path d="' + d2 + '" stroke-width="1" stroke-opacity="' + (ink * 0.45).toFixed(2) + '" stroke-dasharray="' + dash + '"/>' +
              '<path d="' + tk + '" stroke-width="1.2" stroke-opacity="' + (ink * 0.85).toFixed(2) + '"/>' +
              "</g></g>";
          });
          $("f33_lines").innerHTML = ls;

          // ---------- hand-drawn circle around 양호 (white pencil) ----------
          function ellipsePath(seed, rx, ry, rot, a0, a1) {
            var r = rng(seed);
            var ph = r() * 6.28;
            var d = "";
            var cr = Math.cos(rot);
            var sr = Math.sin(rot);
            var n = 0;
            for (var a = a0; a <= a1; a += 0.11) {
              var k = 1 + 0.035 * Math.sin(3 * a + ph) + (r() - 0.5) * 0.012;
              var ex = rx * k * Math.cos(a);
              var ey = ry * k * Math.sin(a);
              var px = 140 + ex * cr - ey * sr;
              var py = 75 + ex * sr + ey * cr;
              d += (n++ ? " L" : "M") + f1(px) + " " + f1(py);
            }
            return d;
          }
          $("f33_circ").innerHTML =
            '<g fill="none" stroke="#F5F5F2" stroke-linecap="round" stroke-linejoin="round">' +
            '<path id="f33_circA" d="' + ellipsePath(77, 118, 54, -0.07, 3.4, 3.4 + 6.283 + 0.55) +
            '" stroke-width="2.2" stroke-opacity="0.85" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>' +
            '<path id="f33_circB" d="' + ellipsePath(91, 114, 51, -0.05, 3.5, 3.5 + 6.283 + 0.3) +
            '" stroke-width="1" stroke-opacity="0.4" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>' +
            "</g>";

          // ================= timeline =================
          var tl = gsap.timeline({ paused: true });

          var SR = "rgba(255, 40, 40, 0.85)";
          var SC = "rgba(0, 220, 255, 0.85)";
          function split(px) {
            return -px + "px 0px 0px " + SR + ", " + px + "px 0px 0px " + SC;
          }
          var SPLIT0 = "0px 0px 0px rgba(255, 40, 40, 0), 0px 0px 0px rgba(0, 220, 255, 0)";
          // chroma-hit: 0ms split, half at +2 frames, closed at +4 frames
          function chroma(el, t, big, small) {
            tl.set(el, { textShadow: split(big) }, t);
            tl.set(el, { textShadow: split(small) }, t + 2 * F);
            tl.set(el, { textShadow: SPLIT0 }, t + 4 * F);
          }
          function flash(t, peak, d) {
            tl.set("#f33_flash", { opacity: peak }, t);
            tl.to("#f33_flash", { opacity: 0, duration: d, ease: "power3.out", lazy: false }, t);
          }

          // ---------- group windows (g1 visible from 0, g2 holds to the end) ----------
          tl.set("#f33_g1", { autoAlpha: 0 }, G2);
          tl.set("#f33_g2", { autoAlpha: 1 }, G2);

          // ---------- g1a: rain [A0, W] ----------
          tl.set("#f33_rain", { autoAlpha: 1 }, A0);
          tl.set("#f33_rain", { autoAlpha: 0 }, W);
          flash(A0, 0.6, 0.32);
          // linear fall along the slant (seek-safe: pure transform tween)
          tl.fromTo("#f33_rainFar", { x: 0, y: 0 }, { x: -SLANT * FAR_D, y: FAR_D, duration: W, ease: "none" }, 0);
          tl.fromTo("#f33_rainNear", { x: 0, y: 0 }, { x: -SLANT * NEAR_D, y: NEAR_D, duration: W, ease: "none" }, 0);
          tl.set("#f33_rainNear", { autoAlpha: 1 }, A1);
          // the rain thins before the cut
          tl.fromTo("#f33_rainAll", { opacity: 1 }, { opacity: 0.45, duration: 0.45, ease: "sine.in", immediateRender: false }, W - 0.45);

          // kinetic-letter-in, restrained: whole line on at the kick, glyphs settle on a short cascade
          var chars = Array.prototype.slice.call(hero1.querySelectorAll(".f33_ch"));
          tl.set(chars, { opacity: 1 }, A0);
          chars.forEach(function (ch, j) {
            tl.fromTo(ch, { y: -26 - j * 2, scale: 1.1 }, { y: 0, scale: 1, duration: 0.5, ease: "expo.out" }, A0 + j * 0.028);
          });
          chroma(hero1, A0, 7, 3);
          tl.fromTo("#f33_rainHeroDrift", { scale: 1 }, { scale: 1.015, duration: W - A0, ease: "none" }, A0);
          // holo-sheen once across the settled line
          tl.set(sheen1, { autoAlpha: 1 }, 0.95);
          tl.fromTo(sheen1, { backgroundPosition: "105% 50%" }, { backgroundPosition: "-5% 50%", duration: 0.6, ease: "sine.inOut" }, 0.95);
          tl.set(sheen1, { autoAlpha: 0 }, 1.55);

          // rule label: types on at 14.33 and holds through the wall cut to 17.39 (3.06s)
          tl.set("#f33_label", { autoAlpha: 1 }, A2);
          tl.fromTo(
            "#f33_label",
            { clipPath: "inset(0% 100% -20% 0%)" },
            { clipPath: "inset(0% 0% -20% 0%)", duration: 0.4, ease: "power2.out" },
            A2
          );

          // ---------- g1b: wall [W, G2] ----------
          tl.set("#f33_wall", { autoAlpha: 1 }, W);
          flash(W, 0.28, 0.24);
          tl.fromTo("#f33_wallPush", { scale: 1 }, { scale: 1.02, duration: G2 - W, ease: "none" }, W);
          tl.fromTo("#f33_hero2", { scale: 1.025 }, { scale: 1, duration: 0.45, ease: "expo.out" }, W);
          // water band rises from below and stops just under the lowest line
          tl.fromTo("#f33_water", { y: 230 }, { y: 0, duration: 2.3, ease: "sine.out" }, W);
          // one pencil line per roll hit, drawn left to right in 0.24s
          LINES.forEach(function (L, i) {
            tl.fromTo(
              "#f33_lr" + i,
              { attr: { width: 0 } },
              { attr: { width: L[2] - L[1] + 76 }, duration: 0.24, ease: "power2.out" },
              H[i]
            );
          });
          chroma($("f33_hero2"), H[2], 4, 1); // 16.21, the strongest snare in the roll
          // 17.16: surface glint
          tl.set("#f33_surf", { backgroundColor: "rgba(245, 245, 242, 0.6)" }, GL);
          tl.to("#f33_surf", { backgroundColor: "rgba(245, 245, 242, 0.22)", duration: 0.2, ease: "power2.out", lazy: false }, GL);

          // ---------- g2: survey sheet [G2, DUR] ----------
          flash(G2, 0.5, 0.3);
          // 3d tilt in, settles to a slight angle, then drifts
          tl.fromTo(
            "#f33_rig",
            { rotationY: 24, rotationX: 10, x: 160, y: 24 },
            { rotationY: -6, rotationX: 5, x: 0, y: 0, duration: 0.62, ease: "expo.out" },
            G2
          );
          tl.fromTo(
            "#f33_rig",
            { rotationY: -6, rotationX: 5 },
            { rotationY: -3.5, rotationX: 3.5, duration: DUR - (G2 + 0.62), ease: "none", immediateRender: false },
            G2 + 0.62
          );
          // projection flicker on
          tl.set("#f33_sheet", { opacity: 0.45 }, G2);
          tl.set("#f33_sheet", { opacity: 1 }, G2 + F);
          tl.set("#f33_sheet", { opacity: 0.72 }, G2 + 2 * F);
          tl.set("#f33_sheet", { opacity: 1 }, G2 + 3 * F);
          // holo light band down the sheet
          tl.set("#f33_sweep", { autoAlpha: 1 }, G2 + 0.12);
          tl.fromTo("#f33_sweep", { y: -170 }, { y: 610, duration: 0.7, ease: "sine.inOut" }, G2 + 0.12);
          tl.set("#f33_sweep", { autoAlpha: 0 }, G2 + 0.82);
          // white pencil circle drawn around 양호, finished before the seal
          tl.fromTo("#f33_circA", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.36, ease: "power1.inOut" }, 4.6);
          tl.fromTo("#f33_circB", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.36, ease: "power1.inOut" }, 4.66);

          // 18.07: the seal fills the empty round frame (outline-to-fill) + chroma-hit + red glow
          tl.set("#f33_seal", { autoAlpha: 0.92, rotation: -7 }, S);
          tl.fromTo("#f33_seal", { scale: 1.14 }, { scale: 1, duration: 2 * F, ease: "power2.out" }, S);
          tl.set("#f33_frame", { borderColor: "rgba(245, 245, 242, 0.22)" }, S);
          tl.set("#f33_sealR", { autoAlpha: 0.9, x: -9, rotation: -7 }, S);
          tl.set("#f33_sealC", { autoAlpha: 0.9, x: 9, rotation: -7 }, S);
          tl.set("#f33_sealR", { x: -4 }, S + 2 * F);
          tl.set("#f33_sealC", { x: 4 }, S + 2 * F);
          tl.set("#f33_sealR", { autoAlpha: 0, x: 0 }, S + 4 * F);
          tl.set("#f33_sealC", { autoAlpha: 0, x: 0 }, S + 4 * F);
          tl.set("#f33_glow", { autoAlpha: 1, scale: 1 }, S);
          tl.fromTo("#f33_glow", { opacity: 1 }, { opacity: 0.6, duration: 0.5, ease: "power2.out", immediateRender: false }, S);
          flash(S, 0.3, 0.22);
          tl.fromTo("#f33_push", { scale: 1 }, { scale: 1.03, duration: DUR - S, ease: "none" }, S);

          tl.set("#f33_hero3", { autoAlpha: 1 }, S);
          tl.fromTo("#f33_hero3", { scale: 1.06 }, { scale: 1, duration: 0.42, ease: "expo.out" }, S);
          chroma($("f33_hero3"), S, 10, 4);

          // 18.67, 19.23: the glow breathes once each, very slightly
          [P1, P2].forEach(function (p) {
            tl.to("#f33_glow", { opacity: 0.8, scale: 1.05, duration: 0.1, ease: "sine.out", lazy: false }, p);
            tl.to("#f33_glow", { opacity: 0.6, scale: 1, duration: 0.36, ease: "sine.inOut", lazy: false }, p + 0.1);
          });

          // ================= holo-layer + hud on TRACK time =================
          tl.fromTo(
            "#f33_scan",
            { backgroundPosition: "0px " + (T0 * 24).toFixed(2) + "px" },
            { backgroundPosition: "0px " + ((T0 + DUR) * 24).toFixed(2) + "px", duration: DUR, ease: "none" },
            0
          );
          tl.fromTo(
            "#f33_bar",
            { width: (T0 / TRACK_END) * 1728 },
            { width: ((T0 + DUR) / TRACK_END) * 1728, duration: DUR, ease: "none" },
            0
          );
          tl.fromTo("#f33_tcStrip", { y: 0 }, { y: -STEPS * 18, duration: DUR, ease: "steps(" + STEPS + ")" }, 0);

          tl.seek(0);
          window.__timelines = window.__timelines || {};
          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
