          var SURGE = 5.18; // 24.89 track: freeze, g1 -> g2 0ms cut
          var HOLD_END = 5.48; // 0.3s breath: timecode + scanline drift freeze too
          var $ = function (id) {
            return document.getElementById(id);
          };
          function glyphs(id) {
            return $(id).querySelectorAll("span");
          }

          // ---- timecode strip: one line per centisecond, 00:19.71 -> 00:27.24 ----
          var CS0 = 1971; // 00:19.71
          var CSF = 2489; // 00:24.89 freeze
          var CS1 = 2724; // 00:27.24
          function pad2(n) {
            return n < 10 ? "0" + n : String(n);
          }
          var html = "";
          for (var c = CS0; c <= CS1; c++) {
            var totalSec = Math.floor(c / 100);
            html += "<span>" + pad2(Math.floor(totalSec / 60)) + ":" + pad2(totalSec % 60) + "." + pad2(c % 100) + "</span>";
          }
          $("f34_hud_tc_strip").innerHTML = html;

          var tl = gsap.timeline({ paused: true });

          // =========================== group spans (0ms cut at the SURGE) ===========================
          tl.set($("f34_g1"), { autoAlpha: 1 }, 0);
          tl.set($("f34_g1"), { autoAlpha: 0 }, SURGE);
          tl.set($("f34_g2"), { autoAlpha: 0 }, 0);
          tl.set($("f34_g2"), { autoAlpha: 1 }, SURGE);

          // kinetic letter entrance (reactive, 0-45ms after the hit)
          function letterIn(els, t, o) {
            o = o || {};
            tl.fromTo(
              els,
              { opacity: 0, y: o.y == null ? 42 : o.y, scaleY: o.sy || 1.12, filter: "blur(" + (o.blur == null ? 10 : o.blur) + "px)" },
              {
                opacity: 1,
                y: 0,
                scaleY: 1,
                filter: "blur(0px)",
                duration: o.dur || 0.3,
                ease: "expo.out",
                stagger: o.stagger == null ? 0.03 : o.stagger,
                transformOrigin: "50% 100%",
              },
              t
            );
          }
          // chroma-hit: red/cyan copies via drop-shadow, 2-3 frames
          function chroma(el, t, px) {
            tl.set(el, { filter: "drop-shadow(" + -px + "px 0px 0px rgba(255,40,40,0.85)) drop-shadow(" + px * 2 + "px 0px 0px rgba(0,220,255,0.85))" }, t);
            tl.set(el, { filter: "drop-shadow(" + -Math.round(px * 0.4) + "px 0px 0px rgba(255,40,40,0.85)) drop-shadow(" + Math.round(px * 0.8) + "px 0px 0px rgba(0,220,255,0.85))" }, t + 0.034);
            tl.set(el, { filter: "none" }, t + 0.1);
          }
          function show(el, on, off) {
            tl.set(el, { autoAlpha: 0 }, 0);
            tl.set(el, { autoAlpha: 1 }, on);
            if (off != null) tl.set(el, { autoAlpha: 0 }, off);
          }

          // =========================== g1 ===========================
          var time = $("f34_g1_time"),
            name = $("f34_g1_name"),
            order = $("f34_g1_order"),
            q1 = $("f34_g1_q1"),
            q2 = $("f34_g1_q2"),
            edge = $("f34_g1_edge");
          tl.set([time, name, order, q1, q2, edge], { filter: "none" }, 0);

          var QCUT = 2.12; // 21.83 strong snare: hard cut to the question
          var ECUT = 4.0; // 23.71: the question cuts, "종이에 닿기 직전까지." builds

          // 19.71 "처리기한 마지막 날, 오후 네 시." (ink-dim headline)
          show(time, 0, QCUT);
          letterIn(glyphs("f34_g1_time"), 0, { y: 26, blur: 8, stagger: 0.024 });
          // 19.95 "“서진 씨,”"
          show(name, 0.24, QCUT);
          letterIn(glyphs("f34_g1_name"), 0.24, { stagger: 0.032 });
          // 20.53 strong hard stop: "“찍고 퇴근하세요.”" slams in with chroma, holds to 21.83
          show(order, 0.82, QCUT);
          tl.fromTo(order, { scale: 1.1, transformOrigin: "0% 60%" }, { scale: 1, duration: 0.26, ease: "expo.out" }, 0.82);
          letterIn(glyphs("f34_g1_order"), 0.82, { y: 30, stagger: 0.018, dur: 0.22, blur: 6 });
          chroma(order, 0.84, 9);
          // hold micro-drift on the lead's lines
          tl.fromTo([time, name, order], { x: 0 }, { x: -10, duration: QCUT, ease: "none" }, 0);

          // texture only: 21.36 hard stop, 23.01 / 23.08. the 인주 통 shadow flickers, the document rows shudder 1px
          var padShadow = $("f34_pad_shadow"),
            padInk = $("f34_pad_ink"),
            rows = $("f34_doc_rows");
          tl.set(padShadow, { opacity: 1 }, 0);
          tl.set(padInk, { opacity: 1 }, 0);
          tl.set(rows, { x: 0, y: 0 }, 0);
          [1.65, 3.3].forEach(function (h) {
            tl.set(padShadow, { opacity: 0.35 }, h);
            tl.set(padShadow, { opacity: 1 }, h + 0.04);
            tl.set(padShadow, { opacity: 0.5 }, h + 0.07);
            tl.set(padShadow, { opacity: 1 }, h + 0.11);
            tl.set(padInk, { opacity: 0.78 }, h + 0.07);
            tl.set(padInk, { opacity: 1 }, h + 0.11);
            tl.set(rows, { x: 1.5, y: -0.6 }, h);
            tl.set(rows, { x: -1, y: 0.4 }, h + 0.032);
            tl.set(rows, { x: 0, y: 0 }, h + 0.065);
            tl.set(rows, { x: 1, y: 0 }, h + 0.07);
            tl.set(rows, { x: 0, y: 0 }, h + 0.105);
          });

          // 21.83 hard cut: the question (two lines), holds to 23.71
          show(q1, QCUT, ECUT);
          show(q2, QCUT, ECUT);
          letterIn(glyphs("f34_g1_q1"), QCUT, { y: 34, stagger: 0.022, dur: 0.26, blur: 6 });
          letterIn(glyphs("f34_g1_q2"), QCUT + 0.08, { y: 34, stagger: 0.022, dur: 0.26, blur: 6 });
          chroma(q1, QCUT + 0.01, 6);
          tl.fromTo([q1, q2], { x: 0 }, { x: -8, duration: ECUT - QCUT, ease: "none" }, QCUT);

          // 23.71 / 24.06 / 24.38 / 24.54: "종이에 닿기 직전까지." in chunks, holds to 24.89
          show(edge, ECUT);
          var eg = glyphs("f34_g1_edge");
          var chunks = [
            [4.0, [0, 1, 2]], // 종이에
            [4.35, [3, 4, 5]], // 닿기
            [4.67, [6, 7, 8]], // 직전
            [4.83, [9, 10, 11]], // 까지.
          ];
          tl.set(eg, { opacity: 0 }, 0);
          chunks.forEach(function (ch) {
            var els = ch[1].map(function (i) {
              return eg[i];
            });
            tl.fromTo(
              els,
              { opacity: 0, y: 30, scale: 1.18, filter: "blur(6px)" },
              { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.16, ease: "expo.out", stagger: 0.022, immediateRender: false },
              ch[0]
            );
          });

          // =========================== the stamp across the roll ===========================
          var move = $("f34_stamp_move");
          var trem = $("f34_stamp_tremble");
          var cam = $("f34_cam");
          var shared = $("f34_shared");
          var FREEZE_Y = -78; // hover: the face clears the box's far edge, so the whole empty 날인란 reads under it
          var ACCEL = 3.74; // 23.45: the fill starts, the descent accelerates
          // 21.83: enters from above on the hard cut, settles high, descends slowly, then plunges with the fill; stops dead at 24.89
          tl.set(move, { y: -1150 }, 0);
          tl.fromTo(move, { y: -1150 }, { y: -420, duration: 0.34, ease: "expo.out", immediateRender: false }, QCUT);
          tl.to(move, { y: -330, duration: ACCEL - (QCUT + 0.34), ease: "sine.inOut" }, QCUT + 0.34);
          tl.to(move, { y: FREEZE_Y, duration: SURGE - ACCEL, ease: "power2.in" }, ACCEL);
          // the stamp's shadow on the empty box darkens as it descends, never meets the face
          var boxShadow = $("f34_box_shadow"),
            boxGlow = $("f34_box_glow");
          tl.set([boxShadow, boxGlow], { opacity: 0 }, 0);
          tl.fromTo(boxShadow, { opacity: 0, attr: { rx: 150, ry: 30 } }, { opacity: 0.75, attr: { rx: 96, ry: 19 }, duration: SURGE - QCUT, ease: "power2.in", immediateRender: false }, QCUT);
          tl.fromTo(boxGlow, { opacity: 0 }, { opacity: 1, duration: SURGE - QCUT, ease: "power3.in", immediateRender: false }, QCUT);
          // dolly push on the desk scene across the roll, landing at exactly 1.0 on the freeze
          tl.set(shared, { scale: 1, opacity: 1, transformOrigin: "1451px 890px" }, 0);
          tl.fromTo(shared, { scale: 1 }, { scale: 0.94, duration: 0.3, ease: "power2.out", immediateRender: false }, QCUT);
          tl.to(shared, { scale: 1, duration: SURGE - (QCUT + 0.3), ease: "power2.in" }, QCUT + 0.3);
          // holo light down the handle once as it arrives
          tl.fromTo($("f34_holo_sweep"), { attr: { y: -60 }, opacity: 0 }, { attr: { y: 340 }, opacity: 1, duration: 0.6, ease: "sine.inOut" }, QCUT + 0.08);
          tl.set($("f34_holo_sweep"), { opacity: 0 }, QCUT + 0.68);

          tl.set(trem, { x: 0, y: 0, rotation: 0 }, 0);
          tl.set(cam, { x: 0, y: 0 }, 0);
          // 22.41 / 23.01 / 23.45: the hand trembles slightly, no screen-shake yet
          [2.7, 3.3, 3.74].forEach(function (h, i) {
            var sgn = i % 2 ? -1 : 1;
            tl.set(trem, { x: sgn * 0.5, y: 1.2, rotation: sgn * 0.25 }, h);
            tl.to(trem, { x: 0, y: 0, rotation: 0, duration: 0.14, ease: "power3.out" }, h + 0.02);
          });
          // 23.71 .. 24.59 roll hits: trembling hand + screen-shake growing 2 -> 8px
          var HITS = [4.0, 4.09, 4.35, 4.46, 4.56, 4.67, 4.83, 4.88];
          var AMP = [2, 2.8, 3.6, 4.4, 5.2, 6, 7, 8];
          HITS.forEach(function (h, i) {
            var a = AMP[i];
            var sgn = i % 2 ? -1 : 1;
            var next = i < HITS.length - 1 ? HITS[i + 1] : SURGE;
            var settle = Math.min(0.12, next - h - 0.02);
            tl.set(trem, { x: sgn * a * 0.3, y: 2 + a * 0.5, rotation: sgn * (0.2 + a * 0.1) }, h);
            tl.to(trem, { x: 0, y: 0, rotation: 0, duration: settle, ease: "power3.out" }, h + 0.02);
            tl.set(cam, { x: sgn * a, y: -a * 0.6 }, h);
            tl.set(cam, { x: -sgn * a * 0.7, y: a * 0.45 }, h + 0.033);
            if (next - h > 0.07) tl.set(cam, { x: sgn * a * 0.35, y: -a * 0.2 }, h + 0.066);
            tl.set(cam, { x: 0, y: 0 }, Math.min(h + 0.1, next - 0.001));
          });

          // =========================== g2: SURGE 24.89 ===========================
          // 0ms freeze: hard-zero every moving part on the hit (face bottom 14px above the dashed box edge)
          tl.set(cam, { x: 0, y: 0 }, SURGE);
          tl.set(trem, { x: 0, y: 0, rotation: 0 }, SURGE);
          tl.set(move, { y: FREEZE_Y }, SURGE);
          tl.set(shared, { scale: 1 }, SURGE);
          // white flash 0.85 -> 0 over 3 frames
          var flash = $("f34_flash");
          tl.set(flash, { opacity: 0 }, 0);
          tl.set(flash, { opacity: 0.85 }, SURGE);
          tl.set(flash, { opacity: 0.5 }, SURGE + 0.034);
          tl.set(flash, { opacity: 0.2 }, SURGE + 0.067);
          tl.set(flash, { opacity: 0 }, SURGE + 0.1);
          // chroma-hit on the whole stage
          tl.set(cam, { filter: "none" }, 0);
          tl.set(cam, { filter: "drop-shadow(-10px 0px 0px rgba(255,40,40,0.85)) drop-shadow(20px 0px 0px rgba(0,220,255,0.85))" }, SURGE);
          tl.set(cam, { filter: "drop-shadow(-4px 0px 0px rgba(255,40,40,0.85)) drop-shadow(8px 0px 0px rgba(0,220,255,0.85))" }, SURGE + 0.034);
          tl.set(cam, { filter: "none" }, SURGE + 0.1);

          // "그대로 들고 있었다." slams in on the hit, holds to 25.70
          var held = $("f34_g2_held"),
            empty = $("f34_g2_empty"),
            last = $("f34_g2_last");
          var CUT1 = 5.99; // 25.70
          var CUT2 = 6.74; // 26.45
          show(held, SURGE, CUT1);
          tl.fromTo(held, { scale: 1.08, transformOrigin: "0% 60%" }, { scale: 1, duration: 0.14, ease: "expo.out", immediateRender: false }, SURGE);

          // 25.70: the stamp tilts as it withdraws; its left edge grazes the margin outside the box
          var GRAZE = 6.24; // 25.95 contact
          tl.to(trem, { x: -85, rotation: -8.3, duration: GRAZE - CUT1, ease: "power2.inOut" }, CUT1);
          tl.to(move, { y: 0, duration: GRAZE - CUT1, ease: "power2.in" }, CUT1);
          tl.to([boxShadow, boxGlow], { opacity: 0, duration: 0.25, ease: "power2.out" }, CUT1);
          var mark = $("f34_mark");
          tl.set(mark, { opacity: 0, scaleX: 0.55, scaleY: 0.7 }, 0);
          tl.set(mark, { opacity: 1 }, GRAZE);
          tl.fromTo(mark, { scaleX: 0.55, scaleY: 0.7 }, { scaleX: 1, scaleY: 1, duration: 0.12, ease: "expo.out", immediateRender: false }, GRAZE);
          // and lifts away, out of frame before the last line (gone by 6.68)
          tl.to(move, { y: -1150, duration: 0.42, ease: "power3.in" }, GRAZE + 0.02);
          tl.to(trem, { rotation: -3, duration: 0.3, ease: "power2.out" }, GRAZE + 0.02);

          // text cuts to "날인란은 비어 있었다." holds to 26.45
          show(empty, CUT1, CUT2);
          tl.fromTo(empty, { scale: 1.05, transformOrigin: "0% 60%", filter: "blur(4px)" }, { scale: 1, filter: "blur(0px)", duration: 0.2, ease: "expo.out", immediateRender: false }, CUT1);

          // 26.45 / 26.70 / 26.95: "나는 도장을 찍지 않고" word by word, holds to the frame end (frame 5 continues it)
          var words = last.querySelectorAll("span");
          var WT = [CUT2, 6.99, 7.24];
          show(last, CUT2);
          tl.set(words, { opacity: 0 }, 0);
          WT.forEach(function (t, i) {
            tl.set(words[i], { opacity: 1 }, t);
            tl.fromTo(
              words[i],
              { y: 22, scale: 1.06, filter: "blur(6px)" },
              { y: 0, scale: 1, filter: "blur(0px)", duration: 0.22, ease: "expo.out", immediateRender: false },
              t
            );
          });
          // the desk steps back so the sentence owns the frame; the red half-moon keeps full strength
          var desk = $("f34_desk");
          tl.set(desk, { opacity: 1 }, 0);
          tl.to(desk, { opacity: 0.5, duration: 0.4, ease: "power2.out" }, CUT2);

          // =========================== holo-layer + hud (track time over 30.0s) ===========================
          // track clock: 19.71 -> 24.89 real time, frozen 0.3s on the SURGE, then resumes and
          // catches up so it reads exactly 27.24 at the cut into frame 5 (2.35 track-s in 2.05 s).
          var scan = $("f34_hl_scan");
          var bar = $("f34_hud_bar");
          var strip = $("f34_hud_tc_strip");
          var TF = 24.89;
          var T1 = 27.24;
          var R2 = DUR - HOLD_END; // 2.05
          tl.fromTo(scan, { backgroundPosition: "0px " + (T0 * 24).toFixed(2) + "px" }, { backgroundPosition: "0px " + (TF * 24).toFixed(2) + "px", duration: SURGE, ease: "none" }, 0);
          tl.fromTo(scan, { backgroundPosition: "0px " + (TF * 24).toFixed(2) + "px" }, { backgroundPosition: "0px " + (T1 * 24).toFixed(2) + "px", duration: R2, ease: "none", immediateRender: false }, HOLD_END);
          tl.fromTo(bar, { width: (T0 / TRACK_END) * 1728 }, { width: (TF / TRACK_END) * 1728, duration: SURGE, ease: "none" }, 0);
          tl.fromTo(bar, { width: (TF / TRACK_END) * 1728 }, { width: (T1 / TRACK_END) * 1728, duration: R2, ease: "none", immediateRender: false }, HOLD_END);
          tl.fromTo(strip, { y: 0 }, { y: -(CSF - CS0) * 18, duration: SURGE, ease: "steps(" + (CSF - CS0) + ")" }, 0);
          tl.fromTo(strip, { y: -(CSF - CS0) * 18 }, { y: -(CS1 - CS0) * 18, duration: R2, ease: "steps(" + (CS1 - CSF) + ")", immediateRender: false }, HOLD_END);

          tl.seek(0);
          window.__timelines = window.__timelines || {};
          window.__timelines[ID] = tl;
        })();
      </script>
      <script>
        /* audited by eye in snapshots: tight display leading / rolling digit strip are intentional */
        document.querySelectorAll("#f34_g1_name span, #f34_g1_order span, #f34_g1_q1 span, #f34_g1_q2 span").forEach(function (e) {
          e.setAttribute("data-layout-allow-overlap", "");
        });
      </script>
    </template>
  </body>
</html>
