          function sealSVG(id, seed) {

          var ROWS = 8;
          var cells = [];
          for (var r = 0; r < ROWS; r++) {
            for (var c = 0; c < COLS; c++) {
              var cell = document.createElement("div");
              cell.className = "f31-cell";
              grid.appendChild(cell);
              cells.push({ el: cell, c: c, r: r });
            }
          }
          var OFF = { backgroundColor: "rgba(245, 245, 242, 0)", boxShadow: "inset 0 0 0 1px rgba(245, 245, 242, 0)" };
          function litSet(i) {
            return cells.filter(function (k) {
              return (k.c * 5 + k.r * 11 + i * 7) % 13 === 0;
            });
          }
          // grid starts on the 1.53 / 1.86 accents, then rides every seal hit
          var GRID_T = [1.53, 1.86].concat(HITS);
          var prev = [];
          GRID_T.forEach(function (t, i) {
            prev.forEach(function (k) {
              tl.set(k.el, OFF, t);
            });
            var lit = litSet(i);
            lit.forEach(function (k) {
              var seal = (k.c + k.r + i) % 4 === 0;
              tl.set(
                k.el,
                {
                  backgroundColor: seal ? "rgba(200, 40, 30, 0.14)" : "rgba(245, 245, 242, 0.045)",
                  boxShadow: "inset 0 0 0 1px rgba(245, 245, 242, 0.1)",
                },
                t
              );
            });
            prev = lit;
          });

          var dim = q("#f31_dim");
          var shake = q("#f31_shake");
          HITS.forEach(function (t, i) {
            // seal lands: 0ms set + 2-frame squash 1.08 -> 1.0
            var s = sealEls[i];
            tl.set(s, { opacity: 0.92 }, t);
            tl.fromTo(s, { scale: 1.08 }, { scale: 1, duration: 2 * F, ease: "power2.out" }, t);

            // small screen jolt on the statement, index-derived direction
            var amp = i < 6 ? 1.0 : 1.6;
            var dx = (((i * 37) % 9) - 4) * amp;
            var dy = (((i * 53) % 7) - 3) * amp;
            tl.set(shake, { x: dx, y: dy }, t);
            tl.to(shake, { x: 0, y: 0, duration: 0.12, ease: "power3.out", lazy: false }, t);

            // statement sinks under the stamps: gently while readable, then hard
            var op = i < 6 ? 1 - (i + 1) * 0.025 : 0.85 - (i - 5) * 0.06;
            tl.set(dim, { opacity: op }, t);
          });

          // counter-punch: 날인 000 -> 날인 200, one 0ms text swap per video frame,
          // accelerating (power2.in), locks on 4.95
          var C0 = HITS[0];
          var cntEl = q("#f31_cnt");
          function pad3(n) {
            return n < 10 ? "00" + n : n < 100 ? "0" + n : String(n);
          }
          tl.set(cntEl, { autoAlpha: 1 }, C0);
          var CN = Math.round((LOCK - C0) / F); // 89 steps
          for (var n = 1; n <= CN; n++) {
            var p = n / CN;
            var val = n === CN ? 200 : Math.min(199, Math.round(200 * p * p));
            var at = n === CN ? LOCK : C0 + n * F - 0.001;
            if (n < CN && at >= LOCK) continue;
            tl.set(cntEl, { textContent: "날인 " + pad3(val) }, at);
          }
          tl.set(cntEl, { scale: 1.16, color: "#F5F5F2" }, LOCK);
          tl.to(cntEl, { scale: 1, duration: 0.38, ease: "expo.out", lazy: false }, LOCK);
          chroma(cntEl, LOCK, 8, 3);

          // ---------- 4.95 hard cut: stamps and statement clear in one frame, 하루 200장. ----------
          tl.set(q("#f31_drift"), { autoAlpha: 0 }, LOCK);
          tl.set(grid, { autoAlpha: 0 }, LOCK);
          tl.set(q("#f31_cut"), { autoAlpha: 1 }, LOCK);
          var cutLine = q("#f31_cutLine");
          var cutPunch = q("#f31_cutPunch");
          tl.set(cutPunch, { scale: 1.07 }, LOCK);
          tl.to(cutPunch, { scale: 1, duration: 0.4, ease: "expo.out", lazy: false }, LOCK);
          chroma(cutLine, LOCK, 12, 5);
          tl.fromTo(q("#f31_cutDrift"), { scale: 1 }, { scale: 1.015, duration: DUR - LOCK, ease: "none" }, LOCK);

          // holo-sheen across the locked line
          sheen(q("#f31_sheen2"), 5.02, 0.56);

          // 5.39: name label above, ink-dim, readable at once (0ms on, small settle)
          var who = q("#f31_who");
          tl.set(who, { opacity: 1 }, 5.39);
          tl.fromTo(who, { y: 8 }, { y: 0, duration: 0.3, ease: "expo.out" }, 5.39);

          // 5.76, 6.46: tiny chroma flickers only; clean from 6.59, final frame held clean
          chroma(cutLine, 5.76, 4, 2);
          chroma(cutLine, 6.46, 4, 2);

          tl.seek(0);
          window.__timelines = window.__timelines || {};
          window.__timelines[ID] = tl;
        })();
      </script>
      <script>
        /* audited by eye in snapshots: tight display leading is intentional */
        document.querySelectorAll("#f31_l1 span, #f31_l2 span").forEach(function (e) { e.setAttribute("data-layout-allow-overlap", ""); });
      </script>
    </template>
