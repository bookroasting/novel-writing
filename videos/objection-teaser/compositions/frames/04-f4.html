      <script>
        (function () {
          var ID = "04-f4";
          var T0 = 12.24; // frame start (track s)
          var DUR = 2.76; // frame length
          var TRACK_END = 15.0;
          var G2 = 13.14 - T0; // 0.90, g1 -> g2 hard cut

          // ---- timecode strip: one pre-built line per centisecond, stepped by a y tween ----
          var CS0 = 1224;
          var CS1 = 1500;
          var STEPS = CS1 - CS0; // 276
          function pad2(n) {
            return n < 10 ? "0" + n : String(n);
          }
          var html = "";
          for (var c = CS0; c <= CS1; c++) {
            var sec = Math.floor(c / 100);
            html += "<span>" + pad2(Math.floor(sec / 60)) + ":" + pad2(sec % 60) + "." + pad2(c % 100) + "</span>";
          }
          document.getElementById("f4_hud_tc_strip").innerHTML = html;

          var tl = gsap.timeline({ paused: true });

          // ================= g1 [0, 0.90]: drawer slam on the 12.24 hard-stop kick =================
          // local 0 is the impact frame: slab already home (no overshoot), edge streak + shake + chroma.
          tl.set("#f4_g1", { autoAlpha: 1, immediateRender: true }, 0);

          // motion-blur streak of the leading edge, gone within 2-3 frames
          tl.fromTo(
            "#f4_g1_streak",
            { opacity: 1, scaleY: 1 },
            { opacity: 0, scaleY: 0.15, duration: 0.09, ease: "power2.out" },
            0
          );
          // impact flash on the drawer's top edge
          tl.fromTo("#f4_g1_edge", { opacity: 0.9 }, { opacity: 0, duration: 0.22, ease: "power2.out" }, 0);

          // "서랍을 닫았다." lands with the slab: tiny scale punch, no ease on arrival
          tl.fromTo(
            "#f4_g1_l2",
            { scale: 1.05, transformOrigin: "50% 60%" },
            { scale: 1, duration: 0.1, ease: "power4.out" },
            0
          );

          // screen-shake 10px decaying in ~0.25s (deterministic amplitudes)
          var amps = [10, -8, 6.5, -5, 3.5, -2.2, 1.2];
          tl.set("#f4_g1_shake", { x: amps[0], y: amps[0] * 0.7, immediateRender: true }, 0);
          for (var i = 1; i < amps.length; i++) {
            tl.to(
              "#f4_g1_shake",
              { x: amps[i], y: amps[i] * 0.7 * (i % 2 ? -1 : 1) * -1, duration: 0.034, ease: "steps(1)" },
              i * 0.034
            );
          }
          tl.to("#f4_g1_shake", { x: 0, y: 0, duration: 0.02, ease: "steps(1)" }, amps.length * 0.034);

          // chroma-hit: split-red / split-cyan copies, 10 -> 6 -> 3px, gone after ~3 frames
          var chroma = [
            ["#f4_g1_l2_r", "#f4_g1_l2_c", [12, 7, 3]],
            ["#f4_g1_l1_r", "#f4_g1_l1_c", [6, 4, 2]],
          ];
          chroma.forEach(function (row) {
            var r = row[0];
            var cy = row[1];
            var off = row[2];
            tl.set(r, { autoAlpha: 1, x: -off[0], immediateRender: true }, 0);
            tl.set(cy, { autoAlpha: 1, x: off[0], immediateRender: true }, 0);
            tl.set(r, { x: -off[1] }, 0.034);
            tl.set(cy, { x: off[1] }, 0.034);
            tl.set(r, { x: -off[2] }, 0.068);
            tl.set(cy, { x: off[2] }, 0.068);
            tl.set(r, { autoAlpha: 0, x: 0 }, 0.102);
            tl.set(cy, { autoAlpha: 0, x: 0 }, 0.102);
          });

          // hold both lines still until 13.14, then 0ms cut
          tl.set("#f4_g1", { autoAlpha: 0 }, G2);

          // ================= g2 [0.90, 2.76]: end card =================
          tl.set("#f4_g2", { autoAlpha: 1 }, G2);

          // short settle: 4px blur / 0.96 scale -> clear within 0.4s
          tl.fromTo(
            "#f4_g2_titlewrap",
            { filter: "blur(4px)", scale: 0.96, transformOrigin: "0% 60%" },
            { filter: "blur(0px)", scale: 1, duration: 0.4, ease: "power2.out" },
            G2
          );
          tl.fromTo(
            "#f4_g2_tag",
            { filter: "blur(4px)", scale: 0.96, transformOrigin: "0% 50%" },
            { filter: "blur(0px)", scale: 1, duration: 0.36, ease: "power2.out" },
            G2 + 0.04
          );
          tl.fromTo(
            "#f4_g2_sub",
            { filter: "blur(4px)", scale: 0.96, transformOrigin: "0% 50%" },
            { filter: "blur(0px)", scale: 1, duration: 0.34, ease: "power2.out" },
            G2 + 0.06
          );
          tl.fromTo(
            "#f4_g2_nalin",
            { filter: "blur(4px)", scale: 0.96, transformOrigin: "50% 50%" },
            { filter: "blur(0px)", scale: 1, duration: 0.38, ease: "power2.out" },
            G2 + 0.02
          );

          // holo-sheen + spotlight sweep across the title, crossing it around 13.58-13.7,
          // finishing at 14.0 so the silence is dead still
          var SW0 = 13.34 - T0; // 1.10
          var SW = 14.0 - 13.34; // 0.66
          tl.set("#f4_g2_sheen", { autoAlpha: 1 }, SW0);
          tl.fromTo(
            "#f4_g2_sheen",
            { backgroundPosition: "100% 50%" },
            { backgroundPosition: "0% 50%", duration: SW, ease: "sine.inOut" },
            SW0
          );
          tl.set("#f4_g2_sheen", { autoAlpha: 0 }, SW0 + SW);

          tl.set("#f4_g2_glow", { autoAlpha: 1 }, SW0);
          tl.fromTo("#f4_g2_glow", { x: -120 }, { x: 1380, duration: SW, ease: "sine.inOut" }, SW0);
          tl.fromTo("#f4_g2_glow", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "sine.out" }, SW0);
          tl.to("#f4_g2_glow", { opacity: 0, duration: 0.2, ease: "sine.in" }, SW0 + SW - 0.2);
          tl.set("#f4_g2_glow", { autoAlpha: 0 }, SW0 + SW);

          // 14.0 -> 15.0: hold. Only the track-time chrome below moves.

          // ================= holo-layer + hud on TRACK time =================
          tl.fromTo(
            "#f4_hl_scan",
            { backgroundPosition: "0px " + (T0 * 24).toFixed(2) + "px" },
            { backgroundPosition: "0px " + (TRACK_END * 24).toFixed(2) + "px", duration: DUR, ease: "none" },

          );
          tl.fromTo(
            "#f4_hud_bar",
            { width: (T0 / TRACK_END) * 1728 },
            { width: 1728, duration: DUR, ease: "none" },
            0
          );
          tl.fromTo(
            "#f4_hud_tc_strip",
            { y: 0 },
            { y: -STEPS * 18, duration: DUR, ease: "steps(" + STEPS + ")" },
            0
          );

          tl.seek(0);
          window.__timelines = window.__timelines || {};
          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
