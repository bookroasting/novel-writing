          // projector flicker (0ms sets)
          tl.set(form, { opacity: 0.35 }, 0);
          tl.set(form, { opacity: 1 }, 0.034);
          tl.set(form, { opacity: 0.55 }, 0.067);
          tl.set(form, { opacity: 1 }, 0.1);
          // scan band sweeps down the sheet as it materialises
          tl.fromTo(
            band,
            { y: -160, opacity: 1 },
            { y: 760, opacity: 0.25, duration: 0.5, ease: "power2.out" },
            0.02
          );
          tl.set(band, { opacity: 0 }, 0.52);
          // micro drift through the hold
          tl.fromTo(
            rig,
            { rotationY: -10, rotationX: 2, y: 0 },
            { rotationY: -7.6, rotationX: 0.8, y: -8, duration: DUR - 0.52, ease: "sine.inOut", immediateRender: false },
            0.52
          );
          // kick punches
          [L(4.946), L(6.13)].forEach(function (at) {
            tl.fromTo(
              punch,
              { scale: 1.018 },
              { scale: 1, duration: 0.36, ease: "power3.out", immediateRender: false },
              at
            );
          });
          // 6.57 riser: one-frame projector dip
          tl.set(form, { opacity: 0.8 }, L(6.571));
          tl.set(form, { opacity: 1 }, L(6.571) + 0.034);

          /* ============ handwritten line ============ */
          var FS = 112;
          var RULE_W = 1320 - 2 - 128; // form content width
          var WID = { g: 0.98, sp: 0.3, dot: 0.36 };
          var UNIT = { g: 1, sp: 0.35, dot: 0.5 };
          var jit = mulberry32(1004);

          function buildLine(rule, text, gxShift) {
            var chars = Array.from(text);
            var kinds = chars.map(function (ch) {
              return ch === " " ? "sp" : ch === "." ? "dot" : "g";
            });
            var lineW = kinds.reduce(function (a, k) {
              return a + WID[k] * FS;
            }, 0);
            var off = (RULE_W - lineW) / 2;
            var tf = chars.map(function () {
              var rot = (jit() * 2 - 1) * 1.2;
              var dy = (jit() * 2 - 1) * 3;
              return "translateY(" + dy.toFixed(2) + "px) rotate(" + rot.toFixed(2) + "deg)";
            });
            var layers = {};
            ["red", "cyan", "ink", "sheen"].forEach(function (name) {
              layers[name] = mk("div", "f2-hl f2-hl-" + name, rule);
            });
            var glyphs = [];
            var cum = 0;
            chars.forEach(function (ch, i) {
              var k = kinds[i];
              var w = WID[k] * FS;
              var rec = { kind: k, gc: null, tip: null };
              ["red", "cyan", "ink", "sheen"].forEach(function (name) {
                var gw = mk("div", "f2-gw", layers[name]);
                gw.style.width = w.toFixed(2) + "px";
                gw.style.transform = tf[i];
                if (k === "sp") return;
                var cls = name === "ink" ? "f2-gc" : name === "sheen" ? "f2-gs" : "f2-gk";
                var g = mk("span", cls, gw);
                g.textContent = ch;
                if (name === "sheen") {
                  g.style.setProperty("--gx", (off + cum - 0.08 * FS + gxShift).toFixed(1) + "px");
                }
                if (name === "ink") {
                  rec.gc = g;
                  rec.tipw = mk("div", "f2-tipw", gw);
                  rec.tip = mk("span", "f2-tip", rec.tipw);
                }
              });
              glyphs.push(rec);
              cum += w;
            });
            return { layers: layers, glyphs: glyphs };
          }

          var CLIP0 = "polygon(0% 0%, 0% 0%, -25% 100%, 0% 100%)";
          var CLIP1 = "polygon(0% 0%, 125% 0%, 100% 100%, 0% 100%)";

          // pencil-stroke wipe, glyph by glyph, ending exactly on `land`
          function writeLine(line, start, land) {
            var total = line.glyphs.reduce(function (a, g) {
              return a + UNIT[g.kind];
            }, 0);
            var u = (land - start) / total;
            var t = start;
            var lastIdx = -1;
            line.glyphs.forEach(function (g, i) {
              if (g.gc) lastIdx = i;
            });
            line.glyphs.forEach(function (g, i) {
              var d = UNIT[g.kind] * u;
              if (g.gc) {
                tl.fromTo(
                  g.gc,
                  { clipPath: CLIP0 },
                  { clipPath: CLIP1, duration: d, ease: "sine.inOut", immediateRender: false },
                  t
                );
                tl.set(g.tip, { opacity: 1 }, t);
                tl.fromTo(
                  g.tipw,
                  { xPercent: 0, yPercent: 0 },
                  { xPercent: 100, yPercent: 26, duration: d, ease: "sine.inOut", immediateRender: false },
                  t
                );
                if (i === lastIdx) {
                  tl.fromTo(
                    g.tip,
                    { opacity: 1 },
                    { opacity: 0, duration: 0.16, ease: "power2.out", immediateRender: false },
                    t + d
                  );
                } else {
                  tl.set(g.tip, { opacity: 0 }, t + d);
                }
              }
              t += d;
            });
          }

          // chroma-hit: red/cyan copies split 10px, 5px, then close (about 3 frames)
          function chroma(line, at) {
            var red = line.layers.red,
              cyan = line.layers.cyan;
            tl.set(red, { opacity: 1, x: -10 }, at);
            tl.set(cyan, { opacity: 1, x: 10 }, at);
            tl.set(red, { x: -5 }, at + 0.034);
            tl.set(cyan, { x: 5 }, at + 0.034);
            tl.set([red, cyan], { opacity: 0, x: 0 }, at + 0.1);
          }

          var line1 = buildLine(q("#f2g1_line1"), "제 점수 말고", 0);
          var line2 = buildLine(q("#f2g1_line2"), "제 집을 봐 주세요.", 78);

          // 4.95 kick: line 1 lands (wipe starts 0.48s early)
          writeLine(line1, L(4.946) - 0.48, L(4.946));
          chroma(line1, L(4.946));
          // 6.13 kick: line 2 lands (wipe starts on the 5.53 snare)
          writeLine(line2, L(5.526), L(6.13));
          chroma(line2, L(6.13));

          // holo-sheen across both lines right after line 2 lands
          var reason = q("#f2g1_reason");
          var sheenAt = L(6.13) + 0.03;
          tl.set([line1.layers.sheen, line2.layers.sheen], { opacity: 1 }, sheenAt);
          tl.fromTo(
            reason,
            { "--f2-sx": "-560px" },
            { "--f2-sx": "1300px", duration: 0.6, ease: "power2.inOut", immediateRender: false },
            sheenAt
          );
          tl.set([line1.layers.sheen, line2.layers.sheen], { opacity: 0 }, sheenAt + 0.62);

          window.__timelines["02-f2"] = tl;
          tl.seek(0);
        })();
      </script>
          <script>
        /* audited by eye in snapshots: tight display leading / rolling digit strip are intentional */
        document.querySelectorAll("#f2_tc_s span, #f2_tc_t span, #f2_tc_h span, #f2_tc_m span").forEach(function (e) { e.setAttribute("data-layout-ignore", ""); });
      </script>
    </template>
  </body>
